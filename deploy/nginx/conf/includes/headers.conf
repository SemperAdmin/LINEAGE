# LINEAGE response headers.
#
# The Content-Security-Policy below is the point of this file. LINEAGE makes no
# network request by design, and constraint 2 forbids one. Served from a host,
# that promise stops being something a reader has to trust about the code and
# becomes something the browser refuses to violate.
#
# default-src 'none'   nothing loads unless named explicitly below
# script-src            the single inline <script> block
# style-src             the single inline <style> block, plus one inline style attribute
# img-src data:         the embedded base64 logo, no remote image
# connect-src 'none'    redundant under default-src, stated so the intent is legible
# form-action 'none'    the annotation form never navigates, and now cannot
# base-uri, frame-ancestors  no base tag injection, no embedding
#
# 'unsafe-inline' is used rather than a hash on purpose. A hash pins the exact
# bytes of the script and breaks the page the moment index.html is edited, which
# is a silent failure in a records tool. The zero-network property this file
# exists to enforce is delivered by default-src and connect-src, and neither is
# weakened by the choice.

add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), usb=(), payment=()" always;
